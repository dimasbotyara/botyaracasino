{% extends 'base.html' %}
{% block title %}🪙 Монетка{% endblock %}
{% block content %}
<div class="slide-up max-w-2xl mx-auto px-2 sm:px-4">
    <div class="flex items-center gap-2 sm:gap-3 mb-4 sm:mb-6">
        <a href="/dashboard" class="text-gray-400 hover:text-violet-400 transition text-sm sm:text-base">← Назад</a>
        <h1 class="text-2xl sm:text-3xl font-black">🪙 Монетка</h1>
    </div>
    <div class="glass neon-border rounded-2xl sm:rounded-3xl p-4 sm:p-8 text-center">
        <div class="mb-4 sm:mb-6">
            <p class="text-gray-400 text-xs sm:text-sm mb-1">Баланс</p>
            <p class="text-2xl sm:text-3xl font-black text-emerald-400" id="game-balance">{{ "%.0f"|format(user.balance) }}₽</p>
        </div>
        <div class="text-6xl sm:text-8xl mb-2" id="coin">🪙</div>
        <p id="coin-res" class="text-lg sm:text-xl font-bold text-gray-500 mb-3 sm:mb-4">Орёл или Решка?</p>
        <div id="result-area" class="mb-4 sm:mb-6 h-12 sm:h-14 flex items-center justify-center"><p class="text-gray-500 text-sm sm:text-base">Коэффициент: x2.0</p></div>
        <input type="number" id="bet-amount" min="1" value="100" class="w-full max-w-xs mx-auto bg-black/40 border border-violet-500/30 rounded-xl px-4 py-3 text-white text-center text-base sm:text-lg font-bold focus:outline-none focus:border-violet-500 mb-3 sm:mb-4">
        <div class="flex justify-center gap-1 sm:gap-2 mb-4 sm:mb-6 flex-wrap">
            {% for v in [50,100,500,1000,5000] %}
            <button onclick="document.getElementById('bet-amount').value={{v}}" class="bg-violet-500/10 border border-violet-500/20 rounded-lg px-2 sm:px-3 py-1 text-xs sm:text-sm hover:bg-violet-500/20">{{ v if v<1000 else '%dK'|format(v//1000) }}</button>
            {% endfor %}
            <button onclick="document.getElementById('bet-amount').value=Math.floor(bal)" class="bg-red-500/10 border border-red-500/20 rounded-lg px-2 sm:px-3 py-1 text-xs sm:text-sm hover:bg-red-500/20 text-red-400">ALL IN</button>
        </div>
        <div class="flex justify-center gap-3 sm:gap-6">
            <button onclick="flip('heads')" class="bg-gradient-to-br from-amber-500 to-amber-700 hover:from-amber-400 w-32 sm:w-40 py-5 sm:py-6 rounded-xl sm:rounded-2xl font-black text-lg sm:text-xl transition hover:scale-105">
                <span class="text-3xl sm:text-4xl block mb-1">🦅</span>Орёл
            </button>
            <button onclick="flip('tails')" class="bg-gradient-to-br from-blue-500 to-blue-700 hover:from-blue-400 w-32 sm:w-40 py-5 sm:py-6 rounded-xl sm:rounded-2xl font-black text-lg sm:text-xl transition hover:scale-105">
                <span class="text-3xl sm:text-4xl block mb-1">👑</span>Решка
            </button>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let flipping=false, bal={{user.balance}};
async function flip(choice){
    if(flipping) return;
    const bet=parseFloat(document.getElementById('bet-amount').value);
    if(!bet||bet<=0) return showToast('Введите ставку','error');
    if(bet>bal) return showToast('Недостаточно средств','error');
    flipping=true;
    const coin=document.getElementById('coin');
    let fc=0, fa=setInterval(()=>{fc++;coin.textContent=fc%2?'💿':'🪙';},100);
    const r=await fetch('/api/game/coinflip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bet,choice})});
    const d=await r.json();
    await new Promise(r=>setTimeout(r,1200));
    clearInterval(fa);
    if(d.success){
        coin.textContent=d.result==='heads'?'🦅':'👑';
        document.getElementById('coin-res').textContent='Выпало: '+(d.result==='heads'?'Орёл 🦅':'Решка 👑');
        bal=d.balance; updateBalance(bal);
        const ra=document.getElementById('result-area');
        if(d.is_win) ra.innerHTML=`<div class="win-animation"><p class="text-2xl font-black text-emerald-400">🎉 +${Math.floor(d.profit)}₽</p></div>`;
        else ra.innerHTML=`<p class="text-xl font-bold text-red-400">😢 -${Math.floor(bet)}₽</p>`;
    }
    flipping=false;
}
</script>
{% endblock %}
