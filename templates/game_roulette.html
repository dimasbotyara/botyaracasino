{% extends 'base.html' %}
{% block title %}🎡 Рулетка{% endblock %}
{% block content %}
<div class="slide-up max-w-2xl mx-auto px-2 sm:px-4">
    <div class="flex items-center gap-2 sm:gap-3 mb-4 sm:mb-6">
        <a href="/dashboard" class="text-gray-400 hover:text-violet-400 transition text-sm sm:text-base">← Назад</a>
        <h1 class="text-2xl sm:text-3xl font-black">🎡 Рулетка</h1>
    </div>
    <div class="glass neon-border rounded-2xl sm:rounded-3xl p-4 sm:p-8 text-center mb-4 sm:mb-6">
        <div class="mb-4 sm:mb-6">
            <p class="text-gray-400 text-xs sm:text-sm mb-1">Баланс</p>
            <p class="text-2xl sm:text-3xl font-black text-emerald-400" id="game-balance">{{ "%.0f"|format(user.balance) }}₽</p>
        </div>
        <div class="w-24 h-24 sm:w-32 sm:h-32 mx-auto rounded-full border-4 border-violet-500/40 flex items-center justify-center bg-black/40 mb-3">
            <span id="roul-num" class="text-4xl sm:text-5xl font-black">?</span>
        </div>
        <p id="roul-col" class="text-base sm:text-lg font-bold text-gray-500 mb-3 sm:mb-4">Крутите!</p>
        <div id="result-area" class="mb-4 sm:mb-6 h-12 sm:h-14 flex items-center justify-center"><p class="text-gray-500 text-sm sm:text-base">Выберите ставку</p></div>
        <input type="number" id="bet-amount" min="1" value="100" class="w-full max-w-xs mx-auto bg-black/40 border border-violet-500/30 rounded-xl px-4 py-3 text-white text-center text-base sm:text-lg font-bold focus:outline-none focus:border-violet-500 mb-3 sm:mb-4">
        <div class="flex justify-center gap-1 sm:gap-2 mb-4 sm:mb-6 flex-wrap">
            {% for v in [50,100,500,1000,5000] %}
            <button onclick="document.getElementById('bet-amount').value={{v}}" class="bg-violet-500/10 border border-violet-500/20 rounded-lg px-2 sm:px-3 py-1 text-xs sm:text-sm hover:bg-violet-500/20">{{ v if v<1000 else '%dK'|format(v//1000) }}</button>
            {% endfor %}
        </div>
        <div class="grid grid-cols-3 gap-2 sm:gap-3 max-w-md mx-auto mb-3 sm:mb-4">
            <button onclick="placeBet('red')" class="bg-red-600 hover:bg-red-500 py-3 sm:py-4 rounded-lg sm:rounded-xl font-bold text-sm sm:text-base transition">🔴 Красное<br><span class="text-xs opacity-70">x2.1</span></button>
            <button onclick="placeBet('green')" class="bg-green-700 hover:bg-green-600 py-3 sm:py-4 rounded-lg sm:rounded-xl font-bold text-sm sm:text-base transition">🟢 Зеро<br><span class="text-xs opacity-70">x40</span></button>
            <button onclick="placeBet('black')" class="bg-gray-800 hover:bg-gray-700 py-3 sm:py-4 rounded-lg sm:rounded-xl font-bold text-sm sm:text-base transition border border-gray-600">⚫ Чёрное<br><span class="text-xs opacity-70">x2.1</span></button>
        </div>
        <div class="grid grid-cols-2 gap-2 sm:gap-3 max-w-md mx-auto mb-3 sm:mb-4">
            <button onclick="placeBet('even')" class="btn-neon py-2 sm:py-3 rounded-lg sm:rounded-xl font-bold text-sm sm:text-base">Чётное x2.1</button>
            <button onclick="placeBet('odd')" class="btn-neon py-2 sm:py-3 rounded-lg sm:rounded-xl font-bold text-sm sm:text-base">Нечётное x2.1</button>
        </div>
        <div class="flex gap-2 items-center justify-center flex-wrap">
            <select id="exact-number" class="bg-black/40 border border-violet-500/30 rounded-xl px-3 py-2 text-white text-sm sm:text-base">
                {% for n in range(0,37) %}
                <option value="{{n}}">{{n}}</option>{% endfor %}
            </select>
            <button onclick="placeBet('number')" class="bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 px-4 sm:px-6 py-2 rounded-xl font-bold text-sm sm:text-base transition">🎯 Число x40</button>
        </div>
    </div>
    <div class="glass rounded-xl sm:rounded-2xl p-3 sm:p-4 border border-gray-800">
        <p class="text-xs sm:text-sm text-gray-400 mb-2">История:</p>
        <div id="roul-hist" class="flex gap-1.5 sm:gap-2 flex-wrap"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
let playing=false, bal={{user.balance}}, hist=[];
async function placeBet(type){
    if(playing) return;
    const bet=parseFloat(document.getElementById('bet-amount').value);
    if(!bet||bet<=0) return showToast('Введите ставку','error');
    if(bet>bal) return showToast('Недостаточно средств','error');
    const num=type==='number'?parseInt(document.getElementById('exact-number').value):0;
    playing=true;
    const display=document.getElementById('roul-num');
    let anim=setInterval(()=>{display.textContent=Math.floor(Math.random()*37);},50);
    const r=await fetch('/api/game/roulette',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bet,bet_type:type,number:num})});
    const d=await r.json();
    await new Promise(r=>setTimeout(r,1500));
    clearInterval(anim);
    if(d.success){
        display.textContent=d.number;
        const cMap={red:'text-red-400 border-red-500 bg-red-500/10',black:'text-gray-300 border-gray-500 bg-gray-500/10',green:'text-emerald-400 border-emerald-500 bg-emerald-500/10'};
        const cNames={red:'🔴 Красное',black:'⚫ Чёрное',green:'🟢 Зеро'};
        document.getElementById('roul-col').className='text-lg font-bold '+cMap[d.color].split(' ')[0];
        document.getElementById('roul-col').textContent=d.number+' — '+cNames[d.color];
        display.parentElement.className='w-32 h-32 mx-auto rounded-full border-4 flex items-center justify-center mb-3 '+cMap[d.color];
        bal=d.balance; updateBalance(bal);
        const ra=document.getElementById('result-area');
        if(d.is_win) ra.innerHTML=`<div class="win-animation"><p class="text-2xl font-black text-emerald-400">🎉 +${Math.floor(d.payout)}₽ (x${d.multiplier})</p></div>`;
        else ra.innerHTML=`<p class="text-xl font-bold text-red-400">😢 -${Math.floor(bet)}₽</p>`;
        const bg=d.color==='red'?'bg-red-500':d.color==='green'?'bg-emerald-500':'bg-gray-600';
        hist.unshift(`<span class="${bg} rounded-lg px-2 py-1 text-xs font-bold">${d.number}</span>`);
        if(hist.length>15) hist.pop();
        document.getElementById('roul-hist').innerHTML=hist.join('');
    }
    playing=false;
}
</script>
{% endblock %}
